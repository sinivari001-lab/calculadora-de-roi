services:
  - type: web
    name: precify
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ML_ACCESS_TOKEN
        sync: false
      - key: ML_REFRESH_TOKEN
        sync: false
      - key: ML_APP_ID
        sync: false
      - key: ML_SECRET_KEY
        sync: false
      - key: PORT
        value: "10000"
